# Turn on the display engine and enable custom screens
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Show the dongle's own battery level along with the keyboard halves
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y
CONFIG_ZMK_DONGLE_DISPLAY_MAC_MODIFIERS=y
CONFIG_ZMK_DONGLE_DISPLAY_WPM=y

# --- THE FIX ---
# Tell the Dongle to accept TWO peripherals (Left and Right)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Allow the Dongle to fetch battery levels from the Left and Right halves
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
