# Turn on the display engine and enable custom screens
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Show the dongle's own battery level along with the keyboard halves
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y

# Show MacOS modifier symbols (Command/Option) instead of Windows (Win/Alt)
CONFIG_ZMK_DONGLE_DISPLAY_MAC_MODIFIERS=y

# Enable the Words-Per-Minute (WPM) meter
CONFIG_ZMK_DONGLE_DISPLAY_WPM=y
